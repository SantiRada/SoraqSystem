<!doctype html>
<html lang="es" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Defaults for the public home (Spanish). Route metadata is set by usePageMeta() from the i18n catalog. -->
    <title>Soraq — El espacio de trabajo UX para diseñar con IA</title>
    <meta
      name="description"
      content="Soraq conecta tu proceso UX —investigación, definición, diseño, validación y entrega— en un único contexto de proyecto, para que cada herramienta de IA parta de lo que ya sabes."
    />
    <link rel="canonical" href="https://soraq.app/" />
    <meta name="robots" content="index, follow" />

    <meta name="theme-color" content="#070709" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Soraq" />
    <meta property="og:title" content="Soraq — El espacio de trabajo UX para diseñar con IA" />
    <meta
      property="og:description"
      content="Un único contexto de proyecto para todo tu proceso UX: investigación, definición, diseño, validación y entrega, conectado con las herramientas de IA que ya usas."
    />
    <meta property="og:url" content="https://soraq.app/" />
    <meta property="og:image" content="https://soraq.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de Soraq y lema: El espacio de trabajo UX para diseñar con IA" />
    <meta property="og:locale" content="es_LA" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Applies the saved theme before first paint (external file keeps CSP free of inline scripts). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <noscript>Soraq necesita JavaScript para funcionar. Actívalo en la configuración de tu navegador.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
